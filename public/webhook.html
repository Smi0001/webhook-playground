<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webhook Dashboard</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

<div class="dashboard-layout">

  <!-- Top Bar -->
  <header class="topbar">
    <a href="../../" class="logo-mark" title="Back to home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/>
      </svg>
      Webhook Inspector
    </a>
    <div class="topbar-divider"></div>
    <span class="topbar-name" id="webhookName">Loading…</span>
    <div class="topbar-divider"></div>
    <div class="topbar-url-box">
      <span class="topbar-url" id="webhookUrl"></span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost" id="copyUrlBtn" title="Copy webhook URL">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy URL
      </button>
      <button class="btn btn-ghost" id="deleteWebhookBtn" title="Delete this webhook URL" style="color:var(--danger);border-color:var(--danger)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        Delete
      </button>
    </div>
  </header>

  <!-- Two-panel content -->
  <div class="content-area" id="contentArea">

    <!-- Sidebar: request list -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">
          Requests
          <span id="connDot" class="conn-dot" style="display:inline-block;vertical-align:middle;margin-left:6px;" title="Connecting…"></span>
        </span>
        <div class="sidebar-actions">
          <button class="sidebar-icon-btn" id="bookmarksBtn" title="Bookmarked requests">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button class="sidebar-icon-btn" id="clearAllBtn" title="Clear all requests">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </div>
      <div class="sidebar-search">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="sidebarSearchInput" placeholder="Search path, body, headers, remark…" spellcheck="false">
        <button class="sidebar-search-clear hidden" id="sidebarSearchClear" title="Clear search">✕</button>
      </div>
      <div class="bookmarks-dropdown hidden" id="bookmarksDropdown"></div>
      <div class="sidebar-list" id="sidebarList">
        <div class="sidebar-empty" id="sidebarEmpty">
          <div class="pulse-ring"></div>
          Waiting for first request…
        </div>
      </div>
    </aside>

    <!-- Main: request detail -->
    <main class="detail-panel" id="detailPanel">
      <div class="detail-empty" id="detailEmpty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
        </svg>
        <h3>Select a request to inspect</h3>
        <p>Incoming webhook requests will appear in the sidebar.</p>
      </div>

      <div class="detail-content hidden" id="detailContent">
        <!-- Summary row -->
        <div class="detail-summary" id="detailSummary"></div>

        <!-- Remark / bookmark -->
        <div class="remark-block" id="remarkBlock">
          <label class="remark-label" for="remarkInput">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            Remark
          </label>
          <input type="text" id="remarkInput" placeholder="Add a note to bookmark this request…" maxlength="200">
          <button class="btn btn-primary btn-sm" id="remarkSaveBtn">Save</button>
          <button class="btn btn-ghost btn-sm hidden" id="remarkClearBtn" title="Remove bookmark">Clear</button>
        </div>

        <!-- Headers -->
        <div class="collapsible open" id="sectionHeaders">
          <div class="collapsible-header" onclick="toggleSection('sectionHeaders')">
            <span class="collapsible-title">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
              Headers
              <span class="collapsible-count" id="headerCount">0</span>
            </span>
            <span class="collapsible-arrow">▾</span>
          </div>
          <div class="collapsible-body">
            <table class="kv-table" id="headersTable"></table>
          </div>
        </div>

        <!-- Query Parameters -->
        <div class="collapsible open" id="sectionQuery">
          <div class="collapsible-header" onclick="toggleSection('sectionQuery')">
            <span class="collapsible-title">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              Query Parameters
              <span class="collapsible-count" id="queryCount">0</span>
            </span>
            <span class="collapsible-arrow">▾</span>
          </div>
          <div class="collapsible-body">
            <table class="kv-table" id="queryTable"></table>
          </div>
        </div>

        <!-- Forwarding -->
        <div class="collapsible open" id="sectionForwarding">
          <div class="collapsible-header" onclick="toggleSection('sectionForwarding')">
            <span class="collapsible-title">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              Forwarding
              <span id="fwdStatusBadge"></span>
            </span>
            <span class="collapsible-arrow">▾</span>
          </div>
          <div class="collapsible-body">
            <div class="fwd-controls">
              <label class="fwd-toggle">
                <input type="checkbox" id="fwdEnabledCheckbox">
                <span>Enable forwarding</span>
              </label>
              <div class="fwd-url-edit" id="fwdUrlEdit" style="display:none">
                <input type="url" id="fwdUrlInput" placeholder="https://example.com/webhook" spellcheck="false">
                <button class="btn btn-primary btn-sm" id="fwdSaveBtn">Save</button>
              </div>
              <div id="fwdPreviousUrl" class="fwd-previous-url" style="display:none"></div>
            </div>
            <div id="fwdDetail" class="fwd-detail"></div>
          </div>
        </div>

        <!-- Body -->
        <div class="collapsible open" id="sectionBody">
          <div class="collapsible-header" onclick="toggleSection('sectionBody')">
            <span class="collapsible-title">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
              Body
            </span>
            <span class="collapsible-arrow">▾</span>
          </div>
          <div class="collapsible-body">
            <div class="body-block" id="bodyBlock"></div>
          </div>
        </div>
      </div>
    </main>

  </div><!-- .content-area -->
</div><!-- .dashboard-layout -->

<!-- Mobile sidebar toggle (only visible < 580px) -->
<button class="sidebar-toggle hidden" id="sidebarToggle" title="Toggle requests list">☰</button>

<div class="toast" id="toast"></div>

<script src="../../app-config.js"></script>
<script src="../../js/dashboard.js"></script>
</body>
</html>
